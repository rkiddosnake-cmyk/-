const CATEGORY_ORDER = ["解剖生理","バイタル","検査値","疾病","薬理","感染対策","社会保障","母性","精神","老年","免疫・アレルギー"];
const STORAGE_KEY = "nq_flashcards_v2";
const TEST_KEY = "nq_flashcards_probe";
const COOKIE_KEY = "nq_backup_v2";
const TEST_COOKIE = "nq_flashcards_cprobe";
const COOKIE_MAX_AGE = 60 * 60 * 24 * 400; // 400 days (browser cap)
const COOKIE_PAYLOAD_LIMIT = 3500; // stay well under the ~4KB cookie ceiling

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function fromBase64(b64) {
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function probeLocalStorage() {
  try {
    localStorage.setItem(TEST_KEY, "1");
    const ok = localStorage.getItem(TEST_KEY) === "1";
    localStorage.removeItem(TEST_KEY);
    return ok;
  } catch (e) {
    return false;
  }
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || data.v !== 2) return null;
    return data;
  } catch (e) {
    return null;
  }
}

/* -----------------------------------------------------------------
   Cookie mirror. Some hosting contexts sandbox localStorage away
   without warning while leaving cookies reachable (or vice versa),
   which is exactly the failure this app was reported to hit: a save
   "succeeds" in-session but the data is gone on the next visit.
   Writing every save through both channels means one flaking out
   silently doesn't cost the user their progress.
---------------------------------------------------------------- */
function setCookie(name, value, maxAgeSeconds) {
  document.cookie = name + "=" + encodeURIComponent(value) + "; path=/; max-age=" + maxAgeSeconds + "; SameSite=Lax";
}

function getCookie(name) {
  const prefix = name + "=";
  const parts = document.cookie ? document.cookie.split("; ") : [];
  for (const part of parts) {
    if (part.indexOf(prefix) === 0) return decodeURIComponent(part.slice(prefix.length));
  }
  return null;
}

function deleteCookie(name) {
  document.cookie = name + "=; path=/; max-age=0";
}

function probeCookie() {
  try {
    setCookie(TEST_COOKIE, "1", 60);
    const ok = getCookie(TEST_COOKIE) === "1";
    deleteCookie(TEST_COOKIE);
    return ok;
  } catch (e) {
    return false;
  }
}

function loadCookieBackup() {
  try {
    const raw = getCookie(COOKIE_KEY);
    if (!raw) return null;
    const data = JSON.parse(fromBase64(raw));
    if (!data || data.v !== 2) return null;
    return data;
  } catch (e) {
    return null;
  }
}

function writeCookieBackup(payloadJson) {
  const b64 = toBase64(payloadJson);
  if (encodeURIComponent(b64).length > COOKIE_PAYLOAD_LIMIT) return false;
  setCookie(COOKIE_KEY, b64, COOKIE_MAX_AGE);
  return true;
}

function formatTime(date) {
  if (!(date instanceof Date)) return "";
  const h = String(date.getHours()).padStart(2, "0");
  const m = String(date.getMinutes()).padStart(2, "0");
  return h + ":" + m;
}

function App() {
  const [storageMode, setStorageMode] = useState("checking"); // checking | auto | manual
  const [localAvailable, setLocalAvailable] = useState(false);
  const [cookieAvailable, setCookieAvailable] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(false);

  const [learnedIds, setLearnedIds] = useState(() => new Set());
  const [userCards, setUserCards] = useState([]);
  const [deletedIds, setDeletedIds] = useState(() => new Set());
  const [hydrated, setHydrated] = useState(false);

  const [mode, setMode] = useState("all"); // all | unlearned | category
  const [activeCategory, setActiveCategory] = useState(CATEGORY_ORDER[0]);
  const [order, setOrder] = useState([]);
  const [cursor, setCursor] = useState(0);
  const [flipped, setFlipped] = useState(false);

  const [showAdd, setShowAdd] = useState(false);
  const [showBackup, setShowBackup] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const [toast, setToast] = useState("");

  const toastTimer = useRef(null);
  const showToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  }, []);

  // startup: probe both storage channels, then hydrate from whichever has data.
  // Reading from localStorage alone was found to silently lose data across a
  // reopen in some hosting contexts, so a cookie mirror backs it up.
  useEffect(() => {
    const localOk = probeLocalStorage();
    const cookieOk = probeCookie();

    let data = null;
    let restoredFrom = null;
    if (localOk) {
      data = loadSaved();
      if (data) restoredFrom = "local";
    }
    if (!data && cookieOk) {
      data = loadCookieBackup();
      if (data) restoredFrom = "cookie";
    }

    if (data) {
      setLearnedIds(new Set(data.learned || []));
      setUserCards(Array.isArray(data.user) ? data.user : []);
      setDeletedIds(new Set(data.deleted || []));
    }

    setLocalAvailable(localOk);
    setCookieAvailable(cookieOk);
    setStorageMode(localOk || cookieOk ? "auto" : "manual");
    setHydrated(true);

    if (restoredFrom) {
      const count = (data.learned || []).length + (data.user || []).length;
      setTimeout(() => showToast("前回の学習データを復元しました(" + count + "件)"), 300);
    }
  }, []);

  // autosave (debounced), auto mode only — writes through every available channel
  // and only reports success once at least one of them actually accepted the write,
  // so the header status reflects whether the change really persisted.
  useEffect(() => {
    if (!hydrated || storageMode !== "auto") return;
    setSaving(true);
    const t = setTimeout(() => {
      const payload = {
        v: 2,
        learned: [...learnedIds],
        user: userCards,
        deleted: [...deletedIds],
      };
      const json = JSON.stringify(payload);
      let ok = false;
      if (localAvailable) {
        try { localStorage.setItem(STORAGE_KEY, json); ok = true; } catch (e) { /* fall through to cookie */ }
      }
      if (cookieAvailable) {
        try { if (writeCookieBackup(json)) ok = true; } catch (e) { /* local may still have succeeded */ }
      }
      setSaveError(!ok);
      if (ok) setLastSaved(new Date());
      setSaving(false);
    }, 600);
    return () => clearTimeout(t);
  }, [learnedIds, userCards, deletedIds, hydrated, storageMode, localAvailable, cookieAvailable]);

  const activeCards = useMemo(() => {
    const preset = PRESET_CARDS.filter((c) => !deletedIds.has(c.id));
    return [...preset, ...userCards];
  }, [deletedIds, userCards]);

  const filteredCards = useMemo(() => {
    if (mode === "all") return activeCards;
    if (mode === "unlearned") return activeCards.filter((c) => !learnedIds.has(c.id));
    return activeCards.filter((c) => c.category === activeCategory);
  }, [mode, activeCategory, activeCards, learnedIds]);

  // rebuild queue order whenever the filter set changes in composition
  const filteredKey = useMemo(() => filteredCards.map((c) => c.id).join(","), [filteredCards]);
  useEffect(() => {
    setOrder(filteredCards.map((c) => c.id));
    setCursor(0);
    setFlipped(false);
  }, [filteredKey]);

  const currentId = order[cursor];
  const currentCard = useMemo(
    () => activeCards.find((c) => c.id === currentId) || null,
    [activeCards, currentId]
  );

  const total = activeCards.length;
  const learnedCount = activeCards.filter((c) => learnedIds.has(c.id)).length;

  function goNext() {
    setFlipped(false);
    setCursor((c) => (order.length ? (c + 1) % order.length : 0));
  }
  function goPrev() {
    setFlipped(false);
    setCursor((c) => (order.length ? (c - 1 + order.length) % order.length : 0));
  }
  function markLearned(value) {
    if (!currentCard) return;
    setLearnedIds((prev) => {
      const next = new Set(prev);
      if (value) next.add(currentCard.id); else next.delete(currentCard.id);
      return next;
    });
    goNext();
  }
  function reshuffle() {
    setOrder((o) => shuffle(o));
    setCursor(0);
    setFlipped(false);
    showToast("シャッフルしました");
  }

  function addCard(front, back, category) {
    const card = { id: "user_" + Date.now() + "_" + Math.floor(Math.random() * 1000), category, front, back };
    setUserCards((prev) => [...prev, card]);
    setShowAdd(false);
    showToast("カードを追加しました");
  }

  function confirmDeleteCurrent() {
    if (!currentCard) return;
    setPendingDelete(currentCard);
  }
  function performDelete() {
    const card = pendingDelete;
    if (!card) return;
    if (card.id.startsWith("user_")) {
      setUserCards((prev) => prev.filter((c) => c.id !== card.id));
    } else {
      setDeletedIds((prev) => new Set(prev).add(card.id));
    }
    setLearnedIds((prev) => {
      const next = new Set(prev);
      next.delete(card.id);
      return next;
    });
    setPendingDelete(null);
    showToast("カードを削除しました");
  }

  function performReset() {
    setLearnedIds(new Set());
    setShowResetConfirm(false);
    showToast("進捗をリセットしました");
  }

  const backupCode = useMemo(() => {
    const payload = { v: 2, learned: [...learnedIds], user: userCards, deleted: [...deletedIds] };
    return toBase64(JSON.stringify(payload));
  }, [learnedIds, userCards, deletedIds]);

  function restoreFromCode(code) {
    try {
      const json = fromBase64(code.trim());
      const data = JSON.parse(json);
      if (!data || data.v !== 2) throw new Error("bad version");
      setLearnedIds(new Set(data.learned || []));
      setUserCards(Array.isArray(data.user) ? data.user : []);
      setDeletedIds(new Set(data.deleted || []));
      showToast("復元しました");
      setShowBackup(false);
      return true;
    } catch (e) {
      return false;
    }
  }

  function retryStorage() {
    const localOk = probeLocalStorage();
    const cookieOk = probeCookie();
    setLocalAvailable(localOk);
    setCookieAvailable(cookieOk);
    if (localOk || cookieOk) {
      setStorageMode("auto");
      setSaveError(false);
      showToast("自動保存が有効になりました");
    } else {
      showToast("まだ接続できません");
    }
  }

  if (!hydrated) return null;

  return (
    <div className="app-shell">
      <div className="brand">
        <div>
          <p className="brand-title">国試単語帳</p>
          <div className="brand-sub">2027.02 看護師国家試験対策</div>
        </div>
        <StatusPill mode={storageMode} saving={saving} lastSaved={lastSaved} error={saveError} onClick={() => setShowBackup(true)} />
      </div>

      {storageMode === "manual" && (
        <div className="mode-banner">
          <span className="glyph">✎</span>
          <span>
            この端末では自動保存が使えないため、手動バックアップモードで動いています。学習が進んだら右上の状態アイコンからバックアップコードをコピーして保管してください。
          </span>
        </div>
      )}

      <div className="progress-card">
        <div className="progress-row">
          <span>{modeLabel(mode, activeCategory)}の進捗</span>
          <span><strong>{learnedCount}</strong> / {total}</span>
        </div>
        <div className="progress-track">
          <div className="progress-fill" style={{ width: (total ? (learnedCount / total) * 100 : 0) + "%" }} />
        </div>
      </div>

      <div className="mode-tabs">
        <button className={"mode-tab" + (mode === "all" ? " active" : "")} onClick={() => setMode("all")}>すべて</button>
        <button className={"mode-tab" + (mode === "unlearned" ? " active" : "")} onClick={() => setMode("unlearned")}>未習得のみ</button>
        <button className={"mode-tab" + (mode === "category" ? " active" : "")} onClick={() => setMode("category")}>カテゴリ別</button>
      </div>

      {mode === "category" && (
        <div className="chip-row">
          {CATEGORY_ORDER.map((cat) => (
            <button
              key={cat}
              className={"chip" + (activeCategory === cat ? " active" : "")}
              onClick={() => setActiveCategory(cat)}
            >
              {cat}
            </button>
          ))}
        </div>
      )}

      <div className="stage">
        {currentCard ? (
          <>
            <div className="card-scene">
              <div className={"card-flip" + (flipped ? " flipped" : "")} onClick={() => setFlipped((f) => !f)}>
                <div className="card-face card-front">
                  {learnedIds.has(currentCard.id) && <span className="learned-badge">覚えた</span>}
                  <div className="card-eyebrow">
                    <span className="card-tag">{currentCard.category}</span>
                    <span className="deck-position">{order.length ? cursor + 1 : 0} / {order.length}</span>
                  </div>
                  <div className="card-body"><p className="card-text">{currentCard.front}</p></div>
                  <div className="card-hint">タップして答えを見る</div>
                </div>
                <div className="card-face card-back">
                  <div className="card-eyebrow">
                    <span className="card-tag">{currentCard.category}</span>
                    <span className="card-label">ANSWER</span>
                  </div>
                  <div className="card-body"><p className="card-text">{currentCard.back}</p></div>
                  <div className="card-hint">タップして表に戻る</div>
                </div>
              </div>
            </div>

            <div className="judge-row">
              <button className="judge-btn pending" onClick={() => markLearned(false)}>まだ</button>
              <button className="judge-btn learned" onClick={() => markLearned(true)}>覚えた</button>
            </div>

            <div className="nav-row">
              <button className="icon-btn" onClick={goPrev} aria-label="前のカード">‹</button>
              <button className="icon-btn" onClick={reshuffle} aria-label="シャッフル">⤮</button>
              <button className="icon-btn" onClick={confirmDeleteCurrent} aria-label="このカードを削除">🗑</button>
              <button className="icon-btn" onClick={goNext} aria-label="次のカード">›</button>
            </div>
          </>
        ) : (
          <div className="empty-state">
            <div className="big">{total === 0 ? "カードがありません" : "すべて覚えました 🎉"}</div>
            <div>{total === 0 ? "「追加」からカードを作成してください" : "モードを切り替えて他のカードも復習しましょう"}</div>
          </div>
        )}
      </div>

      <div className="footer-actions">
        <button className="ghost-btn" onClick={() => setShowAdd(true)}><span className="glyph">＋</span>追加</button>
        <button className="ghost-btn" onClick={() => setShowBackup(true)}><span className="glyph">💾</span>バックアップ</button>
        <button className="ghost-btn" onClick={() => setShowResetConfirm(true)}><span className="glyph">↺</span>進捗リセット</button>
      </div>

      {showAdd && <AddCardModal onClose={() => setShowAdd(false)} onSave={addCard} />}

      {showBackup && (
        <BackupModal
          storageMode={storageMode}
          saving={saving}
          lastSaved={lastSaved}
          saveError={saveError}
          code={backupCode}
          onRetry={retryStorage}
          onRestore={restoreFromCode}
          onClose={() => setShowBackup(false)}
          showToast={showToast}
        />
      )}

      {showResetConfirm && (
        <ConfirmModal
          title="進捗をリセットしますか?"
          desc="すべてのカードが「まだ」の状態に戻ります。この操作は取り消せません。"
          confirmLabel="リセットする"
          onConfirm={performReset}
          onCancel={() => setShowResetConfirm(false)}
        />
      )}

      {pendingDelete && (
        <ConfirmModal
          title="このカードを削除しますか?"
          desc={"「" + pendingDelete.front + "」を削除します。この操作は取り消せません。"}
          confirmLabel="削除する"
          onConfirm={performDelete}
          onCancel={() => setPendingDelete(null)}
        />
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function modeLabel(mode, category) {
  if (mode === "unlearned") return "未習得のみ";
  if (mode === "category") return category;
  return "全体";
}

function StatusPill({ mode, saving, lastSaved, error, onClick }) {
  let dot = "warn", label = "確認中";
  if (mode === "checking") {
    dot = "warn"; label = "確認中";
  } else if (mode === "manual") {
    dot = "warn"; label = "手動保存モード";
  } else if (error) {
    dot = "bad"; label = "保存失敗";
  } else if (saving) {
    dot = "warn"; label = "保存中…";
  } else if (lastSaved instanceof Date) {
    dot = "ok"; label = "保存済み " + formatTime(lastSaved);
  } else {
    dot = "ok"; label = "自動保存";
  }
  return (
    <button className="status-pill" onClick={onClick}>
      <span className={"status-dot " + dot}></span>
      {label}
    </button>
  );
}

function AddCardModal({ onClose, onSave }) {
  const [front, setFront] = useState("");
  const [back, setBack] = useState("");
  const [category, setCategory] = useState(CATEGORY_ORDER[0]);
  const canSave = front.trim().length > 0 && back.trim().length > 0;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <p className="modal-title">カードを追加</p>
        <div>
          <label className="field-label">カテゴリ</label>
          <select value={category} onChange={(e) => setCategory(e.target.value)}>
            {CATEGORY_ORDER.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div>
          <label className="field-label">問題(表)</label>
          <textarea rows="2" value={front} onChange={(e) => setFront(e.target.value)} placeholder="例: 播種性血管内凝固症候群の略称は?" />
        </div>
        <div>
          <label className="field-label">答え(裏)</label>
          <textarea rows="2" value={back} onChange={(e) => setBack(e.target.value)} placeholder="例: DIC" />
        </div>
        <div className="btn-row">
          <button className="secondary-btn" onClick={onClose}>キャンセル</button>
          <button className="primary-btn" disabled={!canSave} onClick={() => onSave(front.trim(), back.trim(), category)}>追加する</button>
        </div>
      </div>
    </div>
  );
}

function BackupModal({ storageMode, saving, lastSaved, saveError, code, onRetry, onRestore, onClose, showToast }) {
  const [pasted, setPasted] = useState("");
  const [restoreError, setRestoreError] = useState(false);

  function copyCode() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(
        () => showToast("コピーしました"),
        () => showToast("コピーに失敗しました")
      );
    } else {
      showToast("このブラウザではコピーできません");
    }
  }

  function tryRestore() {
    const ok = onRestore(pasted);
    setRestoreError(!ok);
  }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <p className="modal-title">保存状態</p>

        {storageMode === "auto" && !saveError && (
          <p className="modal-desc">
            この端末では自動保存が有効です。学習状況は操作のたびに自動で保存されます。
            {saving
              ? " 現在保存中です…"
              : lastSaved instanceof Date
                ? " 最終保存: " + formatTime(lastSaved)
                : " まだ保存された変更はありません。"}
            {" "}念のため、下のバックアップコードを控えておくと安心です。
          </p>
        )}
        {storageMode === "auto" && saveError && (
          <>
            <p className="modal-desc">直前の自動保存に失敗しました。下のコードを今すぐコピーして控えてから、再試行してください。</p>
            <button className="secondary-btn" onClick={onRetry}>再試行する</button>
          </>
        )}
        {storageMode === "manual" && (
          <>
            <p className="modal-desc">この端末では自動保存が使えません。下のコードをコピーしてメモアプリ等に保管し、次回はここに貼り付けて復元してください。</p>
            <button className="secondary-btn" onClick={onRetry}>自動保存を再確認</button>
          </>
        )}

        <div>
          <label className="field-label">バックアップコード</label>
          <div className="code-box">{code}</div>
        </div>
        <button className="primary-btn" onClick={copyCode}>コードをコピー</button>

        <div style={{ borderTop: "1px solid var(--border)", paddingTop: 14 }}>
          <label className="field-label">コードから復元</label>
          <textarea rows="3" value={pasted} onChange={(e) => { setPasted(e.target.value); setRestoreError(false); }} placeholder="保存しておいたコードを貼り付け" />
          {restoreError && <p className="modal-desc" style={{ color: "var(--danger)" }}>コードを読み取れませんでした。貼り付けた内容を確認してください。</p>}
          <div className="btn-row" style={{ marginTop: 10 }}>
            <button className="secondary-btn" onClick={onClose}>閉じる</button>
            <button className="primary-btn" disabled={!pasted.trim()} onClick={tryRestore}>復元する</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ConfirmModal({ title, desc, confirmLabel, onConfirm, onCancel }) {
  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <p className="modal-title">{title}</p>
        <p className="modal-desc">{desc}</p>
        <div className="btn-row">
          <button className="secondary-btn" onClick={onCancel}>キャンセル</button>
          <button className="danger-btn" onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
